name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `tsc -p jsconfig.json` (checkJs) currently reports ~250 pre-existing
      # errors in the JS sources, so it is advisory until the TypeScript
      # migration lands. Remove `continue-on-error` to make it blocking.
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # VITE_* values are baked into the bundle at build time (see
      # src/lib/app-params.js). On pull requests from forks secrets are empty,
      # which is fine: the build still succeeds and the artifact is never deployed.
      - name: Build
        run: npm run build
        env:
          VITE_BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          VITE_BASE44_APP_BASE_URL: ${{ vars.BASE44_APP_BASE_URL }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Base44
    # Only ever deploy from main (push or manual dispatch of main).
    if: github.ref == 'refs/heads/main'
    needs: [quality, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
      BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          if [ -z "$BASE44_API_KEY" ]; then
            echo "::error::Missing secret BASE44_API_KEY (Base44 workspace API key, starts with b44k_). Add it under Settings > Environments > production."
            missing=1
          fi
          if [ -z "$BASE44_APP_ID" ]; then
            echo "::error::Missing secret BASE44_APP_ID (the Base44 app ID). Add it under Settings > Environments > production."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Install from outside the repo so the project .npmrc (min-release-age=7)
      # does not apply. --allow-remote=all is required because the CLI depends
      # on a JSR tarball (@deno/loader), which npm 12 blocks by default.
      - name: Install Base44 CLI
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g base44@latest --allow-remote=all --allow-scripts=esbuild,workerd
          base44 --version

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Deploys entities, functions, connectors, agents, auth config and the
      # prebuilt ./dist (base44/config.jsonc site.outputDirectory).
      - name: Deploy
        run: base44 deploy --yes --no-build --json
