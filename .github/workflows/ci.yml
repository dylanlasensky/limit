name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # VITE_* values are baked into the bundle at build time (see
      # src/lib/app-params.js). On pull requests from forks secrets are empty,
      # which is fine: the build still succeeds and the artifact is never deployed.
      - name: Build
        run: npm run build
        env:
          VITE_BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          VITE_BASE44_APP_BASE_URL: ${{ vars.BASE44_APP_BASE_URL }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Base44
    # Only ever deploy from main (push or manual dispatch of main).
    if: github.ref == 'refs/heads/main'
    needs: [quality, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # The Base44 CLI authenticates non-interactively in one of two ways:
    #   1. BASE44_API_KEY — a *workspace* API key (must start with "b44k_";
    #      Business plan, owner/admin). Personal "b44u_" keys are NOT accepted.
    #   2. BASE44_ACCESS_TOKEN + BASE44_REFRESH_TOKEN — the tokens `base44 login`
    #      stores in ~/.base44/auth/auth.json. The CLI refreshes them itself.
    # Either pair is enough; the check below enforces that.
    env:
      BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
      BASE44_ACCESS_TOKEN: ${{ secrets.BASE44_ACCESS_TOKEN }}
      BASE44_REFRESH_TOKEN: ${{ secrets.BASE44_REFRESH_TOKEN }}
      BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          case "$BASE44_API_KEY" in
            b44k_*) echo "Auth: workspace API key" ;;
            "")
              if [ -n "$BASE44_ACCESS_TOKEN" ] && [ -n "$BASE44_REFRESH_TOKEN" ]; then
                echo "Auth: access + refresh token"
              else
                echo "::error::No Base44 credentials. Set secret BASE44_API_KEY (workspace key starting with b44k_) OR both BASE44_ACCESS_TOKEN and BASE44_REFRESH_TOKEN (from ~/.base44/auth/auth.json after 'base44 login')."
                missing=1
              fi ;;
            *)
              echo "::error::BASE44_API_KEY does not start with b44k_ (a personal b44u_ key is not accepted by the CLI). Use a workspace API key, or set BASE44_ACCESS_TOKEN + BASE44_REFRESH_TOKEN instead."
              missing=1 ;;
          esac
          if [ -z "$BASE44_APP_ID" ]; then
            echo "::error::Missing secret BASE44_APP_ID (the Base44 app ID)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Install from outside the repo so the project .npmrc (min-release-age=7)
      # does not apply. --allow-remote=all is required because the CLI depends
      # on a JSR tarball (@deno/loader), which npm 12 blocks by default.
      - name: Install Base44 CLI
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g base44@latest --allow-remote=all --allow-scripts=esbuild,workerd
          base44 --version

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Deploys entities, functions, connectors, agents, auth config and the
      # prebuilt ./dist (base44/config.jsonc site.outputDirectory).
      - name: Deploy
        run: base44 deploy --yes --no-build --json
