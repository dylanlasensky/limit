name: Unsigned native simulator
on:
  pull_request:
    paths: ["apps/mobile/**", "packages/**", "package*.json", "scripts/native-simulator.mjs", "scripts/patch-native-decoder.mjs", ".github/workflows/native-simulator.yml"]
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/**", "package*.json", "scripts/native-simulator.mjs", "scripts/patch-native-decoder.mjs", ".github/workflows/native-simulator.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: limit-unsigned-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unsigned-native-launch:
    # Standard hosted runners are free for public repositories. Never run this on a paid/private runner.
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      EXPO_PUBLIC_API_URL: https://limit-preview.limit-dylanlasensky.workers.dev
      LIMIT_BUNDLE_IDENTIFIER: com.example.limit.simulator
      LIMIT_NATIVE_RELEASE: "false"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: Generate, compile and launch unsigned simulator app
        run: node scripts/native-simulator.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unsigned-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: release-evidence/native-simulator/
          retention-days: 1
          if-no-files-found: error
