name: Deploy Cloudflare
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [preview, production]
        default: preview
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm ci --prefix worker
      - run: npm run worker:types && npm run typecheck && npm run typecheck:worker && npm test && npm run build
      - name: Migrate, seed and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 migrations apply DB --remote --env "$TARGET_ENV"
          npx wrangler d1 execute DB --remote --env "$TARGET_ENV" --file worker/seed.sql
          npx wrangler deploy --env "$TARGET_ENV"
