name: Promote Cloudflare release
on:
  workflow_dispatch:
    inputs:
      production:
        description: Promote to production after the complete testing gate
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: limit-release-promotion
  cancel-in-progress: false
jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  testing:
    needs: quality
    runs-on: ubuntu-latest
    environment: testing
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm ci --prefix worker && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Deploy and accept testing revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          LIMIT_TEST_ACCOUNTS_DISPOSABLE: ${{ vars.LIMIT_TEST_ACCOUNTS_DISPOSABLE }}
          LIMIT_TEST_EMAIL_A: ${{ secrets.LIMIT_TEST_EMAIL_A }}
          LIMIT_TEST_PASSWORD_A: ${{ secrets.LIMIT_TEST_PASSWORD_A }}
          LIMIT_TEST_EMAIL_B: ${{ secrets.LIMIT_TEST_EMAIL_B }}
          LIMIT_TEST_PASSWORD_B: ${{ secrets.LIMIT_TEST_PASSWORD_B }}
          LIMIT_TEST_EMAIL_BROWSER: ${{ secrets.LIMIT_TEST_EMAIL_BROWSER }}
          LIMIT_TEST_PASSWORD_BROWSER: ${{ secrets.LIMIT_TEST_PASSWORD_BROWSER }}
        run: node scripts/deploy-release.mjs preview
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: testing-release-${{ github.sha }}
          path: release-evidence/
  production:
    if: inputs.production
    needs: testing
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm ci --prefix worker && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Promote same tested revision and accept production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          LIMIT_TEST_ACCOUNTS_DISPOSABLE: ${{ vars.LIMIT_TEST_ACCOUNTS_DISPOSABLE }}
          LIMIT_TEST_EMAIL_A: ${{ secrets.LIMIT_TEST_EMAIL_A }}
          LIMIT_TEST_PASSWORD_A: ${{ secrets.LIMIT_TEST_PASSWORD_A }}
          LIMIT_TEST_EMAIL_B: ${{ secrets.LIMIT_TEST_EMAIL_B }}
          LIMIT_TEST_PASSWORD_B: ${{ secrets.LIMIT_TEST_PASSWORD_B }}
          LIMIT_TEST_EMAIL_BROWSER: ${{ secrets.LIMIT_TEST_EMAIL_BROWSER }}
          LIMIT_TEST_PASSWORD_BROWSER: ${{ secrets.LIMIT_TEST_PASSWORD_BROWSER }}
        run: node scripts/deploy-release.mjs production
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: production-release-${{ github.sha }}
          path: release-evidence/
