name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm ci --prefix worker
      - run: npm run worker:types
      - run: npm run lint && npm run format:check
      - run: npm run typecheck && npm run typecheck:worker
      - run: npm run lint --workspace limit-mobile && npm run typecheck --workspace limit-mobile
      - run: npm run test:native
      - name: Native JavaScript bundles
        working-directory: apps/mobile
        run: npx expo export --platform ios --platform android --output-dir /tmp/limit-native-export
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate && npm run db:seed
      - name: Local API integration
        run: |
          printf 'BETTER_AUTH_SECRET=%s\n' "$(openssl rand -hex 32)" > .dev.vars
          npx wrangler dev --port 8787 > /tmp/worker.log 2>&1 &
          for n in $(seq 1 60); do curl -fsS http://localhost:8787/api/health && break || sleep 1; done
          npm run test:api
      - run: npx playwright install --with-deps chromium
      - run: node tests/hosted/smoke.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: playwright-report/
