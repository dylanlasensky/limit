name: CI
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm ci --prefix worker
      - run: npm run security:check
      - run: npm run media:check
      - run: npm run worker:types
      - run: npm run lint && npm run format:check
      - run: npm run typecheck && npm run typecheck:worker
      - run: npm run lint --workspace limit-mobile && npm run typecheck --workspace limit-mobile
      - name: Expo compatibility
        working-directory: apps/mobile
        run: npx --yes expo-doctor@1.20.4
      - run: npm run test:native
      - name: Native JavaScript bundles
        working-directory: apps/mobile
        run: npx expo export --platform ios --platform android --platform web --output-dir /tmp/limit-native-export
      - run: npm run check:release-source
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate && npm run db:seed
      - name: Local API integration
        run: |
          printf 'BETTER_AUTH_SECRET=%s\n' "$(openssl rand -hex 32)" > .dev.vars
          npx wrangler dev --port 8787 > /tmp/worker.log 2>&1 &
          for n in $(seq 1 60); do curl -fsS http://localhost:8787/api/health && break || sleep 1; done
          npm run test:api
      - run: npx playwright install --with-deps chromium
      - run: node tests/hosted/smoke.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: browser-report
          path: playwright-report/
